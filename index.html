<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101522">
<title>Gear Runner V0.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0}
.app{height:100dvh;max-width:520px;margin:auto;background:#101522;position:relative;overflow:hidden}
.scene{height:55%;min-height:410px;position:relative;overflow:hidden;background:linear-gradient(#24395b 0%,#5d8da0 47%,#8aa47e 48%,#455246 100%)}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 78% 20%,#fff7b3 0 7%,transparent 8%),linear-gradient(#263b65,#6e9ba9 52%,#71845f 53%,#3c433b)}
.mountain{position:absolute;bottom:25%;width:120%;height:34%;left:-10%;background:#3e5260;clip-path:polygon(0 100%,13% 55%,25% 77%,40% 24%,52% 69%,66% 38%,79% 72%,92% 30%,100% 65%,100% 100%)}
.road{position:absolute;bottom:-5%;left:18%;width:64%;height:65%;background:#30343d;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}
.road:after{content:"";position:absolute;left:48%;top:0;width:4%;height:100%;background:repeating-linear-gradient(#f5d979 0 35px,transparent 35px 75px);transform:perspective(180px) rotateX(20deg);opacity:.8}
.sceneTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;display:flex;justify-content:space-between;z-index:5}
.pill{background:#0b101bdb;border:1px solid #ffffff1c;border-radius:16px;padding:7px 10px;backdrop-filter:blur(8px);font-weight:700;font-size:13px}
.hero{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:120px;filter:drop-shadow(0 16px 12px #0007);animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-7px)}}
.loot{position:absolute;right:12%;bottom:25%;width:55px;animation:float 1.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}
.label{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);background:#0a0f18d9;border:1px solid #fff2;border-radius:20px;padding:8px 15px;font-weight:800;font-size:12px}
.panel{position:absolute;left:0;right:0;bottom:0;height:49%;min-height:370px;background:#101522;border-radius:24px 24px 0 0;border-top:1px solid #ffffff14;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);z-index:10}
.handle{width:42px;height:4px;background:#596173;border-radius:10px;margin:0 auto 10px}
.tabs{display:flex;gap:7px;margin-bottom:10px}
.tab{flex:1;padding:9px 6px;border-radius:12px;background:#171d2a;color:#929aab;font-size:12px;font-weight:800}
.tab.active{background:#252e41;color:#fff}
.card{height:180px;border-radius:20px;background:linear-gradient(145deg,#1b2231,#121824);border:1px solid #ffffff18;position:relative;overflow:hidden;padding:13px;touch-action:none;transition:transform .18s,opacity .18s}
.card.rare{box-shadow:0 0 0 1px #4f8cff55,0 12px 35px #1d4fff15}
.card.epic{box-shadow:0 0 0 1px #a05cff77,0 12px 35px #8a3cff15}
.card.legendary{box-shadow:0 0 0 1px #f0b94d99,0 12px 35px #ffae001f}
.itemIcon{position:absolute;right:14px;top:18px;width:100px;height:100px}
.itemName{font-size:19px;font-weight:900;margin-top:3px}
.muted{color:#8e97a8;font-size:12px}
.power{font-size:30px;font-weight:950;margin:8px 0 2px}
.diff{font-weight:800;font-size:12px}
.compare{margin-top:8px;padding:7px 9px;border-radius:10px;background:#0b1019;color:#b9c1d0;font-size:11px}
.hint{position:absolute;bottom:9px;left:0;right:0;text-align:center;color:#737d90;font-size:10px}
.actions{display:flex;gap:8px;margin-top:9px}
.action{flex:1;border-radius:14px;padding:12px;background:#1a2130;font-weight:900}
.action.sell{background:#2a1d24;color:#ff9aa7}
.action.equip{background:#263b72;color:#b9caff}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.slot{height:58px;border-radius:12px;background:#171d29;border:1px solid #ffffff10;display:flex;align-items:center;justify-content:center;position:relative}
.slot img{width:38px;height:38px}.slot b{position:absolute;right:4px;bottom:3px;font-size:9px;color:#dce2ee}
.toast{position:absolute;top:18%;left:50%;transform:translateX(-50%) translateY(-10px);padding:9px 14px;border-radius:14px;background:#090d16eF;border:1px solid #ffffff1c;z-index:20;opacity:0;pointer-events:none;font-weight:800;font-size:12px;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
.statline{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.level{font-weight:900}.up{font-size:11px;color:#aab4c8}
.upBtn{background:#314f9b;border-radius:10px;padding:6px 9px;font-weight:900;font-size:11px}
@media(max-height:720px){.scene{height:52%}.panel{height:52%}.card{height:160px}.slots{margin-top:6px}.slot{height:50px}}
</style>
</head>
<body>
<div class="app">
  <div class="scene">
    <div class="sky"></div><div class="mountain"></div><div class="road"></div>
    <div class="sceneTop">
      <div class="pill">⚡ POWER <span id="powerTop">22</span></div>
      <div class="pill"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2080%2080%22%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2240%22%20r%3D%2232%22%20fill%3D%22%23f3c94d%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2240%22%20r%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%23ffeaa2%22%20stroke-width%3D%225%22%2F%3E%3Cpath%20d%3D%22M45%2024c-11-6-21%202-17%2010%204%207%2018%204%2022%2011%204%208-7%2015-19%2010%22%20fill%3D%22none%22%20stroke%3D%22%239a6a13%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E" style="width:16px;height:16px;vertical-align:middle"> <span id="coinsTop">100</span></div>
    </div>
    <img class="hero" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20240%22%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D%22b%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%235b7cff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23263bb5%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Cellipse%20cx%3D%2290%22%20cy%3D%22225%22%20rx%3D%2248%22%20ry%3D%229%22%20fill%3D%22%23000%22%20opacity%3D%22.22%22%2F%3E%0A%3Ccircle%20cx%3D%2290%22%20cy%3D%2245%22%20r%3D%2228%22%20fill%3D%22%23f0b48b%22%2F%3E%0A%3Cpath%20d%3D%22M61%2044c2-31%2056-40%2061%201-10-8-19-12-31-11-12%200-20%205-30%2010z%22%20fill%3D%22%23242634%22%2F%3E%0A%3Cpath%20d%3D%22M62%2093c8-18%2048-18%2056%200l20%2073-48%2022-48-22z%22%20fill%3D%22url%28%23b%29%22%2F%3E%0A%3Cpath%20d%3D%22M73%20113l-28%2062%2018%209%2030-54zM107%20113l28%2062-18%209-30-54z%22%20fill%3D%22%23f0b48b%22%2F%3E%0A%3Cpath%20d%3D%22M72%20187l-18%2031h28l15-31zM108%20187l18%2031H98l-15-31z%22%20fill%3D%22%23242634%22%2F%3E%0A%3Ccircle%20cx%3D%2279%22%20cy%3D%2248%22%20r%3D%223%22%20fill%3D%22%2320212a%22%2F%3E%3Ccircle%20cx%3D%22101%22%20cy%3D%2248%22%20r%3D%223%22%20fill%3D%22%2320212a%22%2F%3E%0A%3Cpath%20d%3D%22M81%2061c6%204%2012%204%2018%200%22%20fill%3D%22none%22%20stroke%3D%22%239a5b52%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E">
    <img id="lootImg" class="loot" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Cg%20transform%3D%22rotate%28-28%2080%2080%29%22%3E%3Crect%20x%3D%2273%22%20y%3D%2222%22%20width%3D%2218%22%20height%3D%2292%22%20rx%3D%227%22%20fill%3D%22%23dfe6f2%22%2F%3E%3Cpath%20d%3D%22M73%2028h18l-4-15H77z%22%20fill%3D%22%23f5c24b%22%2F%3E%3Crect%20x%3D%2267%22%20y%3D%22101%22%20width%3D%2230%22%20height%3D%2242%22%20rx%3D%228%22%20fill%3D%22%23394155%22%2F%3E%3Cpath%20d%3D%22M72%20111h20%22%20stroke%3D%22%238f9ab0%22%20stroke-width%3D%225%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
    <div class="label">Новый предмет впереди</div>
  </div>

  <div id="toast" class="toast"></div>

  <section class="panel">
    <div class="handle"></div>
    <div class="statline"><div><div class="level">Уровень <span id="level">1</span></div><div class="up">Сила растёт вместе с экипировкой</div></div><button class="upBtn" id="upgradeBtn">УЛУЧШИТЬ · <span id="cost">50</span></button></div>
    <div class="tabs"><button class="tab active">ДОБЫЧА</button><button class="tab">ЭКИПИРОВКА</button><button class="tab">ПРОФИЛЬ</button></div>
    <div id="card" class="card">
      <img id="itemIcon" class="itemIcon" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Cg%20transform%3D%22rotate%28-28%2080%2080%29%22%3E%3Crect%20x%3D%2273%22%20y%3D%2222%22%20width%3D%2218%22%20height%3D%2292%22%20rx%3D%227%22%20fill%3D%22%23dfe6f2%22%2F%3E%3Cpath%20d%3D%22M73%2028h18l-4-15H77z%22%20fill%3D%22%23f5c24b%22%2F%3E%3Crect%20x%3D%2267%22%20y%3D%22101%22%20width%3D%2230%22%20height%3D%2242%22%20rx%3D%228%22%20fill%3D%22%23394155%22%2F%3E%3Cpath%20d%3D%22M72%20111h20%22%20stroke%3D%22%238f9ab0%22%20stroke-width%3D%225%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
      <div class="muted" id="itemType">ОРУЖИЕ · COMMON</div>
      <div class="itemName" id="itemName">Железный клинок</div>
      <div class="power" id="itemPower">+8</div>
      <div class="diff" id="diff">+3 к текущей силе</div>
      <div class="compare" id="compare">Текущий предмет: +5 · Продажа: 18 🪙</div>
      <div class="hint">Свайп влево — продать · вправо — надеть</div>
    </div>
    <div class="actions"><button class="action sell" id="sellBtn">ПРОДАТЬ</button><button class="action equip" id="equipBtn">НАДЕТЬ</button></div>
    <div class="slots" id="slots"></div>
  </section>
</div>

<script>
const icons={Weapon:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Cg%20transform%3D%22rotate%28-28%2080%2080%29%22%3E%3Crect%20x%3D%2273%22%20y%3D%2222%22%20width%3D%2218%22%20height%3D%2292%22%20rx%3D%227%22%20fill%3D%22%23dfe6f2%22%2F%3E%3Cpath%20d%3D%22M73%2028h18l-4-15H77z%22%20fill%3D%22%23f5c24b%22%2F%3E%3Crect%20x%3D%2267%22%20y%3D%22101%22%20width%3D%2230%22%20height%3D%2242%22%20rx%3D%228%22%20fill%3D%22%23394155%22%2F%3E%3Cpath%20d%3D%22M72%20111h20%22%20stroke%3D%22%238f9ab0%22%20stroke-width%3D%225%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E",Helmet:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Cpath%20d%3D%22M38%2092V68c0-31%2019-49%2042-49s42%2018%2042%2049v24H38z%22%20fill%3D%22%236d7cff%22%2F%3E%3Cpath%20d%3D%22M39%2086h82v22H39z%22%20fill%3D%22%2330384f%22%2F%3E%3Cpath%20d%3D%22M58%2064c7-17%2018-25%2031-25s24%208%2031%2025%22%20fill%3D%22none%22%20stroke%3D%22%23aeb7ff%22%20stroke-width%3D%228%22%2F%3E%3Crect%20x%3D%2251%22%20y%3D%22105%22%20width%3D%2258%22%20height%3D%2212%22%20rx%3D%226%22%20fill%3D%22%231e2434%22%2F%3E%3C%2Fsvg%3E",Armor:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Cpath%20d%3D%22M50%2031l30-13%2030%2013%2024%2029-20%2020-9-13v60H55V67l-9%2013-20-20z%22%20fill%3D%22%2359677d%22%2F%3E%3Cpath%20d%3D%22M80%2020v94%22%20stroke%3D%22%23aebbd0%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M52%2059h56%22%20stroke%3D%22%23aebbd0%22%20stroke-width%3D%225%22%2F%3E%3C%2Fsvg%3E",Gloves:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Cpath%20d%3D%22M48%20112c-9-14-8-35-4-54l7-34c2-8%2014-7%2014%202v28l6-41c1-9%2014-8%2014%201v39l6-33c2-9%2014-7%2014%202v36l7-25c2-8%2013-5%2012%204l-4%2048c-2%2020-14%2031-30%2036z%22%20fill%3D%22%23b84f5e%22%2F%3E%3Cpath%20d%3D%22M45%2096c20%205%2043%206%2064%200%22%20stroke%3D%22%23f0a5ae%22%20stroke-width%3D%225%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E",Boots:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Cpath%20d%3D%22M54%2030h42v61l34%2020c10%206%208%2020-4%2020H44c-10%200-15-10-8-18l18-22z%22%20fill%3D%22%234d5568%22%2F%3E%3Cpath%20d%3D%22M55%20100h49%22%20stroke%3D%22%23aeb6c8%22%20stroke-width%3D%227%22%2F%3E%3Cpath%20d%3D%22M44%20130h79%22%20stroke%3D%22%23232838%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E"};
const names={Weapon:["Железный клинок","Стальной тесак","Охотничий меч","Клинок странника"],Helmet:["Кожаный шлем","Стражевой шлем","Шлем следопыта","Королевский шлем"],Armor:["Потёртая броня","Стальная кираса","Броня рейдера","Королевский доспех"],Gloves:["Кожаные перчатки","Боевые перчатки","Перчатки рейдера","Перчатки чемпиона"],Boots:["Дорожные сапоги","Стальные сапоги","Сапоги охотника","Сапоги героя"]};
const rarityNames=["Common","Rare","Epic","Legendary"];
const rarityMult=[1,1.35,1.8,2.5];
const slotNames={Weapon:"Оружие",Helmet:"Шлем",Armor:"Броня",Gloves:"Перчатки",Boots:"Сапоги"};
const types=Object.keys(icons);
let state=JSON.parse(localStorage.getItem("gear_runner_v03")||"null")||{coins:100,level:1,equipped:{Weapon:5,Helmet:2,Armor:3,Gloves:1,Boots:1},current:null};
let current=state.current||makeItem();
let startX=0,dragging=false;

function makeItem(){
 const type=types[Math.floor(Math.random()*types.length)];
 const r=Math.random()<.62?0:Math.random()<.55?1:Math.random()<.72?2:3;
 const base=3+state.level*3+Math.floor(Math.random()*8);
 return {type,rarity:r,level:Math.max(1,state.level+Math.floor(Math.random()*3)-1),power:Math.max(1,Math.round(base*rarityMult[r])),name:names[type][Math.min(3,r+Math.floor(Math.random()*2))]};
}
function sellValue(i){return Math.max(5,Math.round(i.power*(1+i.rarity*.35)+i.level*3))}
function totalPower(){return 10+Object.values(state.equipped).reduce((a,b)=>a+b,0)}
function save(){state.current=current;localStorage.setItem("gear_runner_v03",JSON.stringify(state))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),900)}
function render(){
 document.getElementById("coinsTop").textContent=state.coins;
 document.getElementById("powerTop").textContent=totalPower();
 document.getElementById("level").textContent=state.level;
 const cost=Math.floor(50*Math.pow(1.35,state.level-1)); document.getElementById("cost").textContent=cost;
 document.getElementById("itemIcon").src=icons[current.type];
 document.getElementById("lootImg").src=icons[current.type];
 document.getElementById("itemType").textContent=slotNames[current.type].toUpperCase()+" · "+rarityNames[current.rarity].toUpperCase();
 document.getElementById("itemName").textContent=current.name;
 document.getElementById("itemPower").textContent="+"+current.power;
 const old=state.equipped[current.type]||0,d=current.power-old;
 document.getElementById("diff").textContent=(d>=0?"+":"")+d+" к текущей силе";
 document.getElementById("diff").style.color=d>=0?"#87e8a5":"#ff9ca8";
 document.getElementById("compare").textContent="Текущий предмет: +"+old+" · Продажа: "+sellValue(current)+" 🪙";
 document.getElementById("card").className="card "+rarityNames[current.rarity].toLowerCase();
 const slots=document.getElementById("slots");slots.innerHTML="";
 types.forEach(t=>{const s=document.createElement("div");s.className="slot";s.innerHTML=`<img src="${icons[t]}"><b>+${state.equipped[t]}</b>`;slots.appendChild(s)});
 save();
}
function next(){current=makeItem();render()}
function sell(){state.coins+=sellValue(current);toast("Продано +"+sellValue(current)+" 🪙");next()}
function equip(){const old=state.equipped[current.type]||0;if(old>0){state.coins+=Math.max(1,Math.round(old*.65));toast("Старый предмет продан · +"+Math.max(1,Math.round(old*.65))+" 🪙")}state.equipped[current.type]=current.power;next()}
document.getElementById("sellBtn").onclick=sell;
document.getElementById("equipBtn").onclick=equip;
document.getElementById("upgradeBtn").onclick=()=>{const c=Math.floor(50*Math.pow(1.35,state.level-1));if(state.coins<c){toast("Не хватает монет");return}state.coins-=c;state.level++;toast("Уровень повышен!");next()};
const card=document.getElementById("card");
card.addEventListener("pointerdown",e=>{startX=e.clientX;dragging=true;card.setPointerCapture(e.pointerId)});
card.addEventListener("pointermove",e=>{if(!dragging)return;const dx=e.clientX-startX;card.style.transform=`translateX(${dx*.35}px) rotate(${dx*.025}deg)`});
card.addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;const dx=e.clientX-startX;card.style.transform="";if(Math.abs(dx)>80){card.style.transform=`translateX(${dx>0?110:-110}px) rotate(${dx>0?6:-6}deg)`;setTimeout(()=>dx>0?equip():sell(),100)}});
render();
</script>
</body>
</html>
